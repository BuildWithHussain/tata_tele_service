<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Widget Preview</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #e8e6e1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  /* ── Frappe UI design tokens (light mode gray scale) ── */
  /* gray-50: rgb(248,248,248)  gray-100: rgb(243,243,243)
     gray-200: rgb(237,237,237) gray-300: rgb(226,226,226)
     gray-400: rgb(199,199,199) gray-500: rgb(153,153,153)
     gray-600: rgb(124,124,124) gray-700: rgb(82,82,82)
     gray-800: rgb(56,56,56)    gray-900: rgb(23,23,23)
     red-700: rgb(181,42,42)    red-800: rgb(148,31,31)
     green-600: rgb(48,166,109) */

  .cw-root {
    --cw-surface-7: rgb(23,23,23);     /* gray-900 — main bg */
    --cw-surface-6: rgb(56,56,56);     /* gray-800 — buttons/cards */
    --cw-surface-5: rgb(82,82,82);     /* gray-700 — hover */
    --cw-ink-2: rgb(226,226,226);      /* gray-300 — primary text */
    --cw-ink-4: rgb(153,153,153);      /* gray-500 — secondary text */
    --cw-ink-white: rgb(248,248,248);  /* gray-50 — bright text */
    --cw-red-5: rgb(181,42,42);        /* red-700 — hangup */
    --cw-red-6: rgb(148,31,31);        /* red-800 — hangup hover */
    --cw-green-3: rgb(48,166,109);     /* green-600 — active status */
    --cw-red-text: rgb(181,42,42);     /* red-700 — ended status */
  }

  /* ── Expanded call widget ── */
  .cw-root {
    width: 280px;
    background: var(--cw-surface-7);
    color: var(--cw-ink-2);
    border-radius: 8px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    overflow: hidden;
    animation: cw-enter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: opacity 0.3s;
    font-size: 14px;
    line-height: 1.4;
  }

  @keyframes cw-enter {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
  }

  .cw-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── Header: minimize btn ── */
  .cw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    user-select: none;
  }

  .cw-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .cw-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--cw-surface-6);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cw-avatar svg {
    color: var(--cw-ink-4);
  }

  .cw-contact-info {
    flex: 1;
    min-width: 0;
  }

  .cw-number {
    font-size: 14px;
    font-weight: 500;
    color: var(--cw-ink-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cw-status {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .cw-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cw-green-3);
    animation: cw-pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes cw-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .cw-status-text {
    color: var(--cw-green-3);
  }

  .cw-header-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .cw-icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--cw-ink-white);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .cw-icon-btn:hover {
    background: var(--cw-surface-6);
  }

  /* ── Contact card (body) ── */
  .cw-contact-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 8px;
    gap: 4px;
  }

  .cw-contact-card .cw-avatar-lg {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--cw-surface-6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .cw-contact-card .cw-avatar-lg svg {
    color: var(--cw-ink-4);
  }

  .cw-contact-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--cw-ink-white);
  }

  .cw-contact-phone {
    font-size: 13px;
    color: var(--cw-ink-4);
  }

  /* ── Duration ── */
  .cw-duration {
    text-align: center;
    padding: 4px 0 12px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--cw-ink-4);
  }

  /* ── Actions ── */
  .cw-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding-bottom: 4px;
  }

  .cw-hangup {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--cw-red-5);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    color: var(--cw-ink-white);
  }

  .cw-hangup:hover {
    background: var(--cw-red-6);
  }

  .cw-hangup svg {
    transform: rotate(135deg);
  }

  /* ── Collapsed pill ── */
  .cw-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--cw-surface-7);
    color: var(--cw-ink-2);
    border-radius: 999px;
    padding: 7px 8px;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    font-size: 14px;
    animation: cw-enter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .cw-pill .cw-pill-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--cw-surface-6);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cw-pill .cw-pill-avatar svg {
    color: var(--cw-ink-4);
  }

  .cw-pill-name {
    font-size: 13px;
    color: var(--cw-ink-white);
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cw-pill-sep {
    color: var(--cw-ink-4);
    font-size: 12px;
  }

  .cw-pill-duration {
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--cw-ink-4);
  }

  .cw-pill-hangup {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--cw-red-5);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cw-ink-white);
    transition: background 0.15s;
    flex-shrink: 0;
    margin-left: 2px;
  }

  .cw-pill-hangup:hover {
    background: var(--cw-red-6);
  }

  .cw-pill-hangup svg {
    transform: rotate(135deg);
  }

  /* ── Blink animation for ended state ── */
  @keyframes cw-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .cw-blink {
    animation: cw-blink 1s ease-in-out 6;
  }

  /* ── Preview layout helper ── */
  .preview-label {
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .preview-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
